[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pubfig"
version = "0.1.0"
description = "Desktop editor for publication-ready scientific figures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7,<4",
    "pandas>=2.0,<4",
    "PySide6>=6.5,<7",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
styles = ["SciencePlots>=2.1,<3"]

[project.scripts]
pubfig = "pubfig.application:main"

[tool.setuptools]
include-package-data = false
py-modules = [
    "app",
    "data_parser",
    "main",
    "plot_config",
    "renderer",
    "table_view",
    "theme",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pubfig", "pubfig.*"]
